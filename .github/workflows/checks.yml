name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 1s --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: investigator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d investigator_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/investigator_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-agent.lock -r requirements-cache.lock -r requirements-mcp.lock -r requirements-artifacts.lock
      - run: python -m ruff check backend demo-app tests scripts evaluation/run.py evaluation/build_dataset.py evaluation/answers.py evaluation/diagnosis-v2
      - run: python -m ruff format --check backend demo-app tests scripts evaluation/run.py evaluation/build_dataset.py evaluation/answers.py evaluation/diagnosis-v2
      - run: python -m pytest -q tests evaluation/diagnosis-v2/test_scoring.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
